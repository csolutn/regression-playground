# The playground, published only through a Cloudflare Tunnel to your own hostname (no open ports).
#   docker compose up -d --build        start / update
#   docker compose logs -f web          logs
# Settings and secrets live in deploy.env and tunnel.env (not in git; copy the *.example files).
# Changes for one machine (another host port, CPUs, memory) go in compose.override.yaml (not in git),
# which docker compose reads on top of this file; see README.md.
services:
  web:
    build: .
    env_file: deploy.env                # TRUST_PROXY=1 there behind cloudflared or another HTTPS proxy
    volumes:
      - data:/srv/instance              # playground.db
    ports:
      - "127.0.0.1:8000:8000"           # this computer only, for checks; everyone else uses the tunnel
    restart: unless-stopped
    cpus: 2                             # at most the machine's (or Docker VM's) CPUs; leave some for the rest
    mem_limit: 3g                       # 30-student load test peaked at ~2.5 GB (before runs moved to the browser)
    pids_limit: 512
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file:                           # TUNNEL_TOKEN from the Cloudflare dashboard
      - path: tunnel.env
        required: false                 # without it, start only the web: docker compose up -d --build web
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  data:
