{% extends 'base.html' %}
{% block body_class %}page-admin page-student{% endblock %}
{% block content %}
<main class="admin">
  <header class="admin-head">
    <h1><a href="{{ url_for('admin.index') }}" class="muted">{{ _('Teacher') }}</a> / {{ student.login_id }} · {{ student.name }}</h1>
  </header>
  {% set output_user_id = student.id %}
  {% include 'partials/output.html' %}
</main>
<script>window.OPTIONS = {{ options|tojson }};</script>
<script type="module" src="{{ url_for('static', filename='js/viewer.js') }}"></script>
{% endblock %}
